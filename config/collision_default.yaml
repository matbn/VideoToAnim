# Anticolisao (video2mixamo)
#
# Capsulas por osso (segmento cabeca->filho de direcao + raio) com pares
# curados que nao devem se interpenetrar. A cada execucao os tamanhos sao
# re-detectados da malha anexa (o formato do rig Mixamo e padrao, mas cada
# personagem tem comprimentos de osso proprios) e raios/pen_min escalam.
#
# mode:    fix  -> corrige girando o osso-raiz do membro (ombro/quadril)
#          warn -> apenas registra aviso no relatorio (ex.: abraco)
# movers:  a | b | both - quais membros giram para resolver o par
# enabled: false desliga o par
#
# size_mode: global (escala unica pela mediana das razoes) | per_bone

enabled: true
size_mode: global
damping: 0.6
passes: 2
max_correction_m: 0.03
max_deg_per_frame: 14.0
