# Constraints articulares — preset humanoide (video2mixamo)
#
# kind:  cone  -> limita o angulo TOTAL da rotacao local (graus)
#        x/y/z -> limita um eixo especifico, com min/max ASSIMETRICOS
# stiffness: 0..1 — 1 corrige integralmente, 0 ignora; valores intermediarios
#            aplicam correcao suave (slerp), sem corte seco.
#
# Edite livremente: na proxima execucao o preset e recarregado do arquivo.
# min_deg > max_deg, stiffness fora de [0,1] ou osso inexistente geram ERRO claro.
#
name: humanoid
default_stiffness: 1.0
limits:
- bone: Spine
  kind: x
  min_deg: -30.0
  max_deg: 30.0
  stiffness: 1.0
  note: flexao/extensao do tronco
  note_en: trunk flexion/extension
- bone: Spine
  kind: y
  min_deg: -35.0
  max_deg: 35.0
  stiffness: 1.0
  note: rotacao/rolagem limitada
  note_en: rotation/twist limited
- bone: Spine
  kind: z
  min_deg: -30.0
  max_deg: 30.0
  stiffness: 1.0
  note: inclinacao lateral
  note_en: lateral tilt
- bone: Spine1
  kind: x
  min_deg: -30.0
